services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: example_root_local_only
      MYSQL_DATABASE: cams
      MYSQL_USER: cams
      MYSQL_PASSWORD: camspass
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - cams-db:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  cams-db:
